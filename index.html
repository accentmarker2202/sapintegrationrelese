<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        SAP Latest Integration Release Updates
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- =====================================================
         MENU
    ====================================================== -->

    <nav class="menu-bar">

        <ul>

            <li>
                <a
                    href="#home"
                    class="active"
                >
                    🏠 Home
                </a>
            </li>

            <li>
                <a href="#about">
                    ℹ️ About
                </a>
            </li>

            <li>
                <a href="#services">
                    ⚙️ Services
                </a>
            </li>

            <li>
                <a href="#documentation">
                    📚 Documentation
                </a>
            </li>

            <li>
                <a href="#contact">
                    📧 Contact
                </a>
            </li>

            <li>
                <a href="#help">
                    ❓ Help
                </a>
            </li>

        </ul>

    </nav>


    <!-- =====================================================
         SAP CONTENT
    ====================================================== -->

    <main id="sapContainer">

        <div id="sapContent">

            <div class="sap-logo-container">

                <img
                    class="sap-logo"
                    src="sap-logo-vector.png"
                    alt="SAP Logo"
                >

            </div>


            <h2>
                SAP Integration Module -
                Standard Descriptions
            </h2>


            <div
                id="sapText"
                class="loading"
            >
                Loading SAP content...
            </div>


            <!-- =================================================
                 DATE VERIFICATION
            ================================================== -->

            <div class="date-selector-container">

                <label
                    for="dateInput"
                >
                    📅 Enter the latest date
                    for the recent updates:
                </label>


                <div class="date-input-row">

                    <input
                        type="date"
                        id="dateInput"
                        autocomplete="off"
                    >


                    <button
                        type="button"
                        id="verifyDateButton"
                    >
                        Continue
                    </button>

                </div>


                <div
                    id="dateError"
                    class="form-error"
                ></div>

            </div>

        </div>

    </main>


    <!-- =====================================================
         SECURE CHAT CONTAINER
    ====================================================== -->

    <section
        id="askmeContainer"
        aria-label="Secure Chat"
    >

        <!-- =================================================
             CHAT HEADER
        ================================================== -->

        <div id="askmeHeader">

            <span>
                💬 Secure Chat Portal
            </span>


            <button
                type="button"
                class="close-btn"
                id="closeaskmeBtn"
            >
                Close Chat
            </button>

        </div>


        <!-- =================================================
             PASSWORD GATE
        ================================================== -->

        <div
            id="chatPasswordGate"
            class="chat-gate"
        >

            <div class="password-card">

                <div class="lock-icon">
                    🔐
                </div>


                <h2>
                    Secure Chat
                </h2>


                <p>
                    Enter the password to
                    view chat history and
                    send messages.
                </p>


                <form
                    id="passwordForm"
                >

                    <label
                        for="chatPassword"
                    >
                        Chat Password
                    </label>


                    <input
                        type="password"
                        id="chatPassword"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >


                    <button
                        type="submit"
                        id="unlockButton"
                    >
                        Unlock Chat
                    </button>


                    <button
                        type="button"
                        id="cancelPasswordBtn"
                        class="secondary-button"
                    >
                        Cancel
                    </button>


                    <div
                        id="passwordError"
                        class="form-error"
                    ></div>

                </form>

            </div>

        </div>


        <!-- =================================================
             AUTHENTICATED CHAT
        ================================================== -->

        <div
            id="authenticatedChat"
            class="authenticated-chat"
        >

            <div
                id="askme"
            ></div>


            <form
                id="form"
            >

                <input
                    type="text"
                    id="msg"
                    placeholder="Information to be checked..."
                    required
                    autocomplete="off"
                    maxlength="2000"
                >


                <button
                    type="submit"
                >
                    Send
                </button>

            </form>

        </div>

    </section>


    <script
        src="script.js"
    ></script>


</body>

</html>
